<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大小写转换工具 - 在线中英文大小写转换</title>
  <meta name="description" content="免费在线大小写转换工具，支持英文句子大小写转换、中文拼音首字母大写，浏览器本地处理。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/case-converter/">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a1a; color: #e2e8f0; font-family: system-ui, sans-serif; min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 16px; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: all 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
    .btn-outline { border: 1px solid rgba(99,102,241,0.4); transition: all 0.3s; }
    .btn-outline:hover { background: rgba(99,102,241,0.1); }
    textarea { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #e2e8f0; resize: vertical; }
    textarea:focus { outline: none; border-color: #6366f1; }
  </style>
</head>
<body class="flex flex-col items-center justify-start p-6">

  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">大小写转换工具</h1>
    <p class="text-gray-400 mt-2 text-sm">英文大小写 / 中文拼音首字母大写</p>
  </header>

  <main class="w-full max-w-2xl flex flex-col gap-4">

    <!-- 转换按钮 -->
    <div class="flex gap-2 flex-wrap">
      <button onclick="transform('uppercase')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">全部大写 UPPER</button>
      <button onclick="transform('lowercase')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">全部小写 lower</button>
      <button onclick="transform('title')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">首字母大写 Title</button>
      <button onclick="transform('sentence')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">句首大写 Sentence.</button>
      <button onclick="transform('toggle')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">大小写互换 tOGGLE</button>
      <button onclick="transform('pinyin')" class="btn-outline px-4 py-2 rounded-lg text-sm text-gray-300">拼音首字母</button>
    </div>

    <!-- 输入 -->
    <div class="glass p-4">
      <label class="text-xs text-gray-500 block mb-2">输入</label>
      <textarea id="input" rows="6" class="w-full p-3" placeholder="输入英文或中文文本..."></textarea>
    </div>

    <!-- 操作 -->
    <div class="flex gap-3">
      <button onclick="applyTransform()" class="btn-primary flex-1 py-3 rounded-xl font-medium text-white">转换</button>
      <button onclick="swap()" class="btn-outline px-4 py-3 rounded-xl text-gray-400">交换 ↑↓</button>
      <button onclick="clearAll()" class="btn-outline px-4 py-3 rounded-xl text-gray-500 text-sm">清空</button>
    </div>

    <!-- 输出 -->
    <div class="glass p-4">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs text-gray-500">输出</label>
        <button onclick="copy()" class="text-xs text-indigo-400 hover:text-indigo-300">复制</button>
      </div>
      <textarea id="output" rows="6" class="w-full p-3" readonly placeholder="结果将在此显示..."></textarea>
    </div>

    <!-- 示例 -->
    <div class="glass p-4 text-xs text-gray-500">
      <p class="mb-2 text-gray-400">示例文本：</p>
      <div class="flex gap-2 flex-wrap">
        <button onclick="setSample('hello world')" class="btn-outline px-3 py-1 rounded text-gray-400">hello world</button>
        <button onclick="setSample('THE QUICK BROWN FOX')" class="btn-outline px-3 py-1 rounded text-gray-400">THE QUICK BROWN FOX</button>
        <button onclick="setSample('你好世界')" class="btn-outline px-3 py-1 rounded text-gray-400">你好世界</button>
      </div>
    </div>

  </main>

  <script>
    let currentTransform = 'uppercase';

    function transform(t) {
      currentTransform = t;
      applyTransform();
    }

    function applyTransform() {
      const input = document.getElementById('input').value;
      if (!input) return;
      let out = '';
      switch (currentTransform) {
        case 'uppercase': out = input.toUpperCase(); break;
        case 'lowercase': out = input.toLowerCase(); break;
        case 'title': out = input.replace(/\b[a-z]/g, c => c.toUpperCase()); break;
        case 'sentence': out = input.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase()); break;
        case 'toggle': out = input.split('').map(c => c === c.toUpperCase() && c !== c.toLowerCase() ? c.toLowerCase() : c.toUpperCase()).join(''); break;
        case 'pinyin': out = pinyinInitials(input); break;
      }
      document.getElementById('output').value = out;
    }

      for (let char of str) {
        if (/[a-zA-Z]/.test(char)) {
          result += char.toUpperCase();
        } else if (/[\u4e00-\u9fa5]/.test(char)) {
          // 找对应汉字的首字母
          const idx = char.codePointAt(0) - 0x4E00;
          if (idx >= 0 && idx < map.length) result += map[idx].toUpperCase();
          else result += char;
        } else {
          result += char;
        }
      }
      return result;
    }

    function swap() {
      [document.getElementById('input').value, document.getElementById('output').value] =
      [document.getElementById('output').value, document.getElementById('input').value];
    }

    function setSample(s) { document.getElementById('input').value = s; applyTransform(); }

    function copy() {
      const v = document.getElementById('output').value;
      if (!v) return;
      navigator.clipboard.writeText(v).then(() => {
        const btn = document.querySelector('[onclick="copy()"]');
        btn.textContent = '已复制!';
        setTimeout(() => btn.textContent = '复制', 1500);
      });
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
    }
